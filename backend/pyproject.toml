[project]
name = "openclip-ai-backend"
version = "0.1.0"
description = "FastAPI backend for IDK Clips"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # The agent passes per-request timeouts; only Starlette's in-process TestClient warns about it.
    "ignore:You should not use the 'timeout' argument with the TestClient",
]
markers = [
    "integration: needs FFmpeg, Ollama or AI models; skipped automatically when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603",  # subprocess calls use fixed argument lists, never a shell
    "E501",  # line length is handled by `ruff format`; long user-facing strings stay readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["app", "openclip_processing"]
known-third-party = ["alembic"]
