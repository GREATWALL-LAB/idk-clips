# Every push and pull request: lint, type checks, all test suites, production build,
# SEO/link checks, secret scan and dependency audits. Deployments only run after this.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and processing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install FFmpeg (used by the export tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -e processing
      - name: Lint (ruff)
        run: |
          ruff check backend/app backend/tests
          ruff check processing
      - name: Backend tests
        working-directory: backend
        run: pytest -q -p no:cacheprovider
      - name: Processing tests
        working-directory: processing
        run: pytest -q -p no:cacheprovider
      - name: Dependency audit (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt

  web:
    name: Web interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://idk-clips.vercel.app' }}
      NEXT_PUBLIC_GITHUB_URL: ${{ github.server_url }}/${{ github.repository }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
      - name: SEO, metadata and broken-link check
        run: npm run check:site
      - name: Dependency audit (npm)
        run: npm audit --omit=dev

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install detect-secrets==1.5.0
      - name: Scan tracked files against the reviewed baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
