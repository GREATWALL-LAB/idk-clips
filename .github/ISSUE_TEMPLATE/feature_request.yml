name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow first, then the idea.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This keeps IDK Clips free for everyone (no paid-only features) and respects users' privacy.
          required: true
