[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openclip-processing"
version = "0.1.0"
description = "Media processing library for IDK Clips: FFmpeg helpers, transcription, AI clip detection and captions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["openclip_processing*"]

[tool.setuptools.package-data]
openclip_processing = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs FFmpeg, Ollama or AI models; skipped automatically when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "E501"]  # fixed subprocess argument lists; line length handled by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
